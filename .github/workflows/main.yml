
name: Controllo Supabase Archivio Pro

on:
  schedule:
    - cron: '17 7 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Archivio Pro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          curl --fail --silent --show-error \
            --max-time 30 \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/archivio_pro_ping"

          echo ""
          echo "Controllo Archivio Pro completato"
