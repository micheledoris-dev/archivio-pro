
name: Controllo Supabase Archivio Pro

on:
  schedule:
    - cron: '17 7 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verifica disponibilita Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          test -n "$SUPABASE_URL"

          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 2 \
            "$SUPABASE_URL/auth/v1/health"

          echo ""
          echo "Controllo Supabase completato"
